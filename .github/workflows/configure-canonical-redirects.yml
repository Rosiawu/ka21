name: Configure Cloudflare Canonical Redirects

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit settings before applying them
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - name: Audit or configure ka21.org zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: node scripts/cloudflare/configure-canonical-redirects.mjs
