name: Update Podcast Dashboard Snapshot

on:
  workflow_dispatch:
  schedule:
    # Run twice daily in the cloud (10:10 and 22:10 Asia/Shanghai).
    - cron: '10 2 * * *'
    - cron: '10 14 * * *'

permissions:
  contents: write

concurrency:
  group: podcast-dashboard-update
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      data_commit: ${{ steps.commit.outputs.data_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 第一步：抓取播放量，写入本地 JSON ───────────────────────────────────
      - name: Capture podcast snapshot
        run: |
          for attempt in 1 2 3; do
            echo "Capture attempt ${attempt}/3"
            if npm run podcast:capture-snapshot; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Podcast capture failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify today's snapshot and preserved history
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const file = 'data/podcast-dashboard/snapshots.json';
          const before = JSON.parse(execFileSync('git', ['show', `HEAD:${file}`], {
            encoding: 'utf8',
            maxBuffer: 20 * 1024 * 1024,
          }));
          const after = JSON.parse(fs.readFileSync(file, 'utf8'));
          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date());
          const afterDates = new Set(after.map((item) => item.date));
          const missing = [...new Set(before.map((item) => item.date))].filter((date) => !afterDates.has(date));
          const duplicateDates = after.map((item) => item.date).filter((date, index, dates) => dates.indexOf(date) !== index);
          if (!afterDates.has(today)) throw new Error(`Today's snapshot is missing: ${today}`);
          if (missing.length) throw new Error(`Historical snapshots were removed: ${missing.join(', ')}`);
          if (duplicateDates.length) throw new Error(`Duplicate snapshot dates: ${[...new Set(duplicateDates)].join(', ')}`);
          console.log(`Verified ${after.length} unique snapshots through ${today}; no historical dates removed.`);
          NODE

      - name: Report captured podcast episodes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cache = JSON.parse(fs.readFileSync('data/podcast-dashboard/episodes-cache.json', 'utf8'));
          const episodes = Array.isArray(cache.episodes) ? cache.episodes : [];
          const latest = episodes[0];
          console.log(`Episode cache: ${episodes.length} episodes`);
          if (latest) {
            console.log(`Latest episode: ${latest.title}`);
          }
          NODE

      # ── 第二步：同步到飞书多维表（幂等，失败不影响后续 commit）──────────────
      - name: Sync to Feishu Bitable
        if: ${{ env.FEISHU_APP_ID != '' && env.FEISHU_APP_SECRET != '' && env.FEISHU_BASE_TOKEN != '' }}
        env:
          FEISHU_APP_ID:     ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
        run: |
          # 将 FEISHU_BASE_TOKEN 写入 schema.json（供脚本读取）
          mkdir -p scripts/feishu
          node -e "
            const s = {
              app_token: process.env.FEISHU_BASE_TOKEN,
              tables: JSON.parse(process.env.FEISHU_TABLE_IDS || '{}'),
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString()
            };
            require('fs').writeFileSync('scripts/feishu/schema.json', JSON.stringify(s, null, 2));
          "
          npm run feishu:podcast:sync || echo "⚠️  飞书同步失败，跳过（本地 JSON 不变）"
        continue-on-error: true

      # ── 第三步：提交本地 JSON 变更 ───────────────────────────────────────────
      - name: Commit and push data updates
        id: commit
        run: |
          if git diff --quiet -- data/podcast-dashboard/config.json data/podcast-dashboard/episodes-cache.json data/podcast-dashboard/snapshots.json; then
            echo "No podcast data changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcast-dashboard/config.json data/podcast-dashboard/episodes-cache.json data/podcast-dashboard/snapshots.json
          git commit -m "chore: update podcast dashboard snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "data_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: capture
    if: needs.capture.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout updated data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.capture.outputs.data_commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deployment is intentionally separate: a Cloudflare failure must not hide a successful capture.
      - name: Prepare Worker runtime secrets
        id: runtime-secrets
        env:
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          KA21_ADMIN_USERNAME: ${{ secrets.KA21_ADMIN_USERNAME }}
          KA21_ADMIN_PASSWORD: ${{ secrets.KA21_ADMIN_PASSWORD }}
          KA21_ADMIN_SESSION_SECRET: ${{ secrets.KA21_ADMIN_SESSION_SECRET }}
          KA21_ADMIN_BEARER_TOKEN: ${{ secrets.KA21_ADMIN_BEARER_TOKEN }}
          KA21_TUTORIAL_ACCESS_PASSWORD: ${{ secrets.KA21_TUTORIAL_ACCESS_PASSWORD }}
          KA21_TUTORIAL_ACCESS_SECRET: ${{ secrets.KA21_TUTORIAL_ACCESS_SECRET }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const secretMap = {
            GITHUB_TOKEN: process.env.WORKER_GITHUB_TOKEN,
            KA21_ADMIN_USERNAME: process.env.KA21_ADMIN_USERNAME,
            KA21_ADMIN_PASSWORD: process.env.KA21_ADMIN_PASSWORD,
            KA21_ADMIN_SESSION_SECRET: process.env.KA21_ADMIN_SESSION_SECRET,
            KA21_ADMIN_BEARER_TOKEN: process.env.KA21_ADMIN_BEARER_TOKEN,
            KA21_TUTORIAL_ACCESS_PASSWORD: process.env.KA21_TUTORIAL_ACCESS_PASSWORD,
            KA21_TUTORIAL_ACCESS_SECRET: process.env.KA21_TUTORIAL_ACCESS_SECRET,
            WECHAT_APP_ID: process.env.WECHAT_APP_ID,
            WECHAT_APP_SECRET: process.env.WECHAT_APP_SECRET,
          };
          const filtered = Object.fromEntries(
            Object.entries(secretMap).filter(([, value]) => typeof value === 'string' && value.length > 0)
          );
          fs.writeFileSync('.cloudflare-runtime-secrets.json', JSON.stringify(filtered, null, 2));
          console.log(`Prepared ${Object.keys(filtered).length} Worker runtime secrets.`);
          NODE
          count=$(node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('.cloudflare-runtime-secrets.json', 'utf8'));
          process.stdout.write(String(Object.keys(data).length));
          NODE
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Sync Worker runtime secrets
        if: steps.runtime-secrets.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret bulk .cloudflare-runtime-secrets.json

      - name: Warn when Worker runtime secrets are missing
        if: steps.runtime-secrets.outputs.count == '0'
        run: |
          echo "::warning::No Worker runtime secrets were synced. Cloudflare write APIs will stay read-only until WORKER_GITHUB_TOKEN and the related admin/tutorial secrets are configured in GitHub Actions secrets."

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
